<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Moment For You</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            /* Latar belakang menggunakan gambar yang direferensikan verbatim */
            background: url('greet2.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden; /* Mencegah scroll karena ini halaman tunggal */
        }

                /* --- CSS PARTIKEL BINTANG BARU --- */
        .particle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Tidak menghalangi interaksi klik */
            z-index: 1; /* Di atas background, di bawah konten utama */
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%; /* Membuat bentuk bulat */
            box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.8); /* Efek bersinar */
            opacity: 0;
            animation: twinkle infinite ease-in-out; /* Animasi muncul redup */
        }

        @keyframes twinkle {
            0% {
                opacity: 0;
                transform: scale(0.1);
            }
            50% {
                opacity: 0.9;
                transform: scale(0.4); /* Membesar sedikit saat bersinar terang */
            }
            100% {
                opacity: 0;
                transform: scale(0.2);
            }
        }
        /* --- AKHIR CSS PARTIKEL --- */

        /* Kontainer Utama */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            text-align: center;
        }

        /* Bagian Teks */
        .header-text {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .subtitle1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-style: italic;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.7), 0 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Kontainer Video */
        .video-wrapper {
            width: 90%;
            max-width: 450px;
            /* Aspect ratio standar video landscape 16:9 */
            aspect-ratio: 16 / 9; 
            background-color: #d3d3d3; /* Warna abu-abu/putih sebagai placeholder */
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            overflow: hidden; /* Memastikan video mengikuti border-radius */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }

        /* Elemen Video Asli */
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Tombol Birthday Wishes */
        .btn-wishes {
            background-color: transparent;
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-wishes:hover {
            background-color: #ffffff;
            color: #1c2a63;
        }

        /* Responsif tambahan untuk layar yang sangat kecil */
        @media (max-width: 360px) {
            .title { font-size: 2.4rem; }
            .btn-wishes { padding: 10px 20px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <!-- Kontainer Partikel -->
    <div class="particle-container" id="particles"></div>
    <div class="container">
        <!-- Header dengan AOS -->
        <div class="header-text">
            <h1 class="subtitle1" data-aos="fade-down" data-aos-delay="100">A Moment For You</h1>
            <p class="subtitle" data-aos="fade-left" data-aos-delay="300">☆ a spesial video ☆</p>
        </div>

        <!-- Wadah Video -->
        <div class="video-wrapper" data-aos="zoom-out">
            <!-- Masukkan URL atau path file video Anda di atribut src di bawah ini -->
            <!-- Tambahkan atribut autoplay muted loop jika ingin video otomatis memutar -->
            <video controls>
                <source src="walvvd.mp4" type="video/mp4">
                Video tidak didukung di browser Anda.
            </video>
        </div>

        <!-- Tombol Lanjut dengan AOS -->
        <button class="btn-wishes" id="wishesBtn" onclick="window.location.href='page8.html'" data-aos="fade-up" data-aos-delay="200">
            BIRTHDAY WISHES &raquo;
        </button>
    </div>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Inisialisasi AOS
        AOS.init({
            duration: 1200,
            easing: 'ease-in-out',
            once: true,
            offset: 50
        });

        // --- JAVASCRIPT PARTIKEL BINTANG ---
        function createStars() {
            const container = document.getElementById('particles');
            const starCount = 120; // Jumlah partikel bintang agar terlihat banyak dan menyebar

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                // Menentukan posisi menyebar secara acak (0 hingga 100%)
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                star.style.left = `${posX}vw`;
                star.style.top = `${posY}vh`;

                // Ukuran acak yang sangat kecil (bulat kecil 2px - 5px)
                const size = 2 + Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                // Durasi (muncul redup) dan penundaan animasi acak
                const duration = 2.5 + Math.random() * 4; 
                star.style.animationDuration = `${duration}s`;
                const delay = Math.random() * 6;
                star.style.animationDelay = `${delay}s`;

                container.appendChild(star);
            }
        }

        // Panggil fungsi partikel saat halaman dimuat
        window.addEventListener('load', createStars);
        // --- AKHIR JAVASCRIPT PARTIKEL ---
    </script>

</body>
</html>
