<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday - Final</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            /* Latar belakang menggunakan gambar yang direferensikan verbatim */
            background: url('greet2.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden; /* Mencegah scroll karena ini halaman tunggal */
        }

                /* --- CSS PARTIKEL BINTANG BARU --- */
        .particle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Tidak menghalangi interaksi klik */
            z-index: 1; /* Di atas background, di bawah konten utama */
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%; /* Membuat bentuk bulat */
            box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.8); /* Efek bersinar */
            opacity: 0;
            animation: twinkle infinite ease-in-out; /* Animasi muncul redup */
        }

        @keyframes twinkle {
            0% {
                opacity: 0;
                transform: scale(0.1);
            }
            50% {
                opacity: 0.9;
                transform: scale(0.4); /* Membesar sedikit saat bersinar terang */
            }
            100% {
                opacity: 0;
                transform: scale(0.2);
            }
        }
        /* --- AKHIR CSS PARTIKEL --- */

        /* Kontainer Utama */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 25px;
            /* Menarik sedikit ke atas agar posisinya pas secara visual seperti pada gambar */
            margin-top: -10vh; 
        }

        /* Tipografi Judul */
        .subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            /* Efek bayangan halus agar teks lebih terbaca */
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
        }

        /* Tipografi Pesan */
        .message-text {
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 45px;
            max-width: 320px; /* Menjaga agar teks tidak terlalu melebar di layar tablet/desktop */
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        /* Tombol Replay */
        .btn-replay {
            background-color: transparent;
            color: #ffffff;
            border: 1.5px solid #ffffff;
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Efek Hover saat tombol disentuh */
        .btn-replay:hover {
            background-color: #ffffff;
            color: #1c2a63;
        }

        /* Responsif tambahan untuk layar yang sangat kecil (seperti iPhone SE) */
        @media (max-width: 360px) {
            .title { font-size: 2.8rem; }
            .message-text { font-size: 0.65rem; margin-bottom: 35px; }
            .btn-replay { padding: 10px 20px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <!-- Kontainer Partikel -->
    <div class="particle-container" id="particles"></div>

    <div class="container">
        <!-- Judul dengan AOS -->
        <h1 class="subtitle" data-aos="fade-down" data-aos-delay="100">Happy Birthday</h1>
        
        <!-- Pesan Penutup dengan AOS -->
        <p class="message-text" data-aos="fade-up" data-aos-delay="300">
            Thank you for being part of my life.<br>
            I hope this little gift can make your special day even more beautiful
        </p>

        <!-- Tombol Replay dengan AOS -->
        <button class="btn-replay" id="replayBtn" onclick="window.parent.location.href='index.html'" data-aos="zoom-in" data-aos-delay="500">
            ☆ REPLAY FROM START
        </button>
    </div>
    
    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // Inisialisasi AOS
        AOS.init({
            duration: 1200,      // Durasi animasi 1.2 detik
            easing: 'ease-in-out',
            once: true,          // Animasi hanya berjalan sekali
            offset: 50           // Jarak trigger dari viewport
        });

        // --- JAVASCRIPT PARTIKEL BINTANG ---
        function createStars() {
            const container = document.getElementById('particles');
            const starCount = 120; // Jumlah partikel bintang agar terlihat banyak dan menyebar

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                // Menentukan posisi menyebar secara acak (0 hingga 100%)
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                star.style.left = `${posX}vw`;
                star.style.top = `${posY}vh`;

                // Ukuran acak yang sangat kecil (bulat kecil 2px - 5px)
                const size = 2 + Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                // Durasi (muncul redup) dan penundaan animasi acak
                const duration = 2.5 + Math.random() * 4; 
                star.style.animationDuration = `${duration}s`;
                const delay = Math.random() * 6;
                star.style.animationDelay = `${delay}s`;

                container.appendChild(star);
            }
        }

        // Panggil fungsi partikel saat halaman dimuat
        window.addEventListener('load', createStars);
        // --- AKHIR JAVASCRIPT PARTIKEL ---
    </script>

</body>
</html>
