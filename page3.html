<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open His Gift</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(rgba(0, 40, 110, 0.7), rgba(0, 40, 110, 0.7)), url('greet2.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* --- CSS PARTIKEL BINTANG BARU --- */
        .particle-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.8);
            opacity: 0;
            animation: twinkle infinite ease-in-out;
        }

        @keyframes twinkle {
            0% {
                opacity: 0;
                transform: scale(0.1);
            }
            50% {
                opacity: 0.9;
                transform: scale(0.4);
            }
            100% {
                opacity: 0;
                transform: scale(0.2);
            }
        }
        /* --- AKHIR CSS PARTIKEL --- */

        /* --- CSS BALON --- */
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            animation: floatUp linear forwards;
            pointer-events: none;
        }

        .balloon-body {
            width: 50px;
            height: 60px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            position: relative;
            margin: 0 auto;
        }

        .balloon-body::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 15px;
            background-color: rgba(255, 255, 255, 0.6);
        }

        .balloon-string {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 30px;
            background: rgba(255, 255, 255, 0.4);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) rotate(20deg) scale(1.2);
                opacity: 0;
            }
        }

        @keyframes sway {
            0%, 100% { transform: translateX(0px); }
            50% { transform: translateX(15px); }
        }

        .balloon.sway {
            animation: sway 2s ease-in-out infinite;
        }
        /* --- AKHIR CSS BALON --- */

        /* Teks Bagian Atas */
        .top-text {
            position: absolute;
            top: 20%;
            font-family: 'Playfair Display', serif;
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            text-align: center;
            width: 100%;
            z-index: 5;
        }

        /* Teks Bagian Bawah */
        .bottom-text {
            position: absolute;
            bottom: 20%;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            width: 100%;
            z-index: 5;
        }

        /* Area Container Kado */
        .gift-container {
            position: relative;
            width: 160px;
            height: 180px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-top: 20px;
            z-index: 10;
        }

        /* Bagian Bawah Kado */
        .gift-box {
            position: relative;
            width: 140px;
            height: 95px;
            background-color: #1a2253;
            border: 2px solid #a3c4f7;
            border-radius: 4px 4px 8px 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Pita Kado */
        .gift-box::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            height: 15px;
            background-color: #a3c4f7;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
        }

        .gift-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 100%;
            background-color: #a3c4f7;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
        }

        /* Grup Tutup Kado */
        .lid-group {
            position: absolute;
            bottom: 93px;
            width: 154px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 10;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: bottom left;
        }

        .gift-container.open .lid-group {
            transform: translate(-30px, -50px) rotate(-25deg);
        }

        /* Tutup Kado */
        .gift-lid {
            position: relative;
            width: 100%;
            height: 30px;
            background-color: #4872c0;
            border: 2px solid #a3c4f7;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .gift-lid::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 100%;
            background-color: #a3c4f7;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.5);
        }

        /* Hiasan Pita / Bow */
        .bow {
            position: relative;
            width: 80px;
            height: 50px;
            margin-bottom: -2px;
            z-index: 2;
        }

        .bow-left, .bow-right {
            position: absolute;
            bottom: 0;
            width: 45px;
            height: 45px;
            background-color: #a3c4f7;
            border: 2px solid #ffffff;
        }

        .bow-left {
            left: 0;
            border-radius: 50% 50% 10% 50%;
            transform: rotate(-20deg);
        }

        .bow-right {
            right: 0;
            border-radius: 50% 50% 50% 10%;
            transform: rotate(20deg);
        }

        .bow-center {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 20px;
            background-color: #a3c4f7;
            border: 2px solid #ffffff;
            border-radius: 50%;
            z-index: 3;
        }

        /* Animasi pulse untuk kado */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .gift-container.pulse {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Responsif */
        @media (max-width: 480px) {
            .gift-container {
                width: 130px;
                height: 150px;
            }
            .gift-box {
                width: 115px;
                height: 80px;
            }
            .lid-group {
                width: 125px;
                height: 65px;
                bottom: 78px;
            }
            .gift-lid {
                height: 25px;
            }
            .bow {
                width: 65px;
                height: 40px;
            }
            .bow-left, .bow-right {
                width: 35px;
                height: 35px;
            }
            .bow-center {
                width: 15px;
                height: 15px;
                bottom: 3px;
            }
            .top-text {
                font-size: 0.6rem;
                top: 27%;
            }
            .bottom-text {
                font-size: 0.7rem;
                bottom: 28%;
            }
            .balloon-body {
                width: 35px;
                height: 45px;
            }
        }
    </style>
</head>
<body>

    <!-- Kontainer Partikel -->
    <div class="particle-container" id="particles"></div>

    <!-- Kontainer Balon -->
    <div class="balloon-container" id="balloonContainer"></div>

    <div class="top-text" data-aos="fade-down" data-aos-delay="100">☆ MENGHITUNG HARI ☆</div>

    <div class="gift-container" id="giftBox" data-aos="zoom-in" data-aos-delay="300">
        <div class="lid-group">
            <div class="bow">
                <div class="bow-left"></div>
                <div class="bow-right"></div>
                <div class="bow-center"></div>
            </div>
            <div class="gift-lid"></div>
        </div>
        <div class="gift-box"></div>
    </div>

    <div class="bottom-text" data-aos="fade-up" data-aos-delay="500">Klik untuk membuka hadiahmu!</div>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <!-- GSAP Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>
        // --- INISIALISASI AOS ---
        AOS.init({
            duration: 1000,
            easing: 'ease-in-out',
            once: true,
            offset: 50
        });

        // --- JAVASCRIPT PARTIKEL BINTANG ---
        function createStars() {
            const container = document.getElementById('particles');
            const starCount = 120;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                star.style.left = `${posX}vw`;
                star.style.top = `${posY}vh`;

                const size = 2 + Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                const duration = 2.5 + Math.random() * 4;
                star.style.animationDuration = `${duration}s`;
                const delay = Math.random() * 6;
                star.style.animationDelay = `${delay}s`;

                container.appendChild(star);
            }
        }

        window.addEventListener('load', createStars);
        // --- AKHIR JAVASCRIPT PARTIKEL ---

        // --- FUNGSI BALON ---
        function createBalloon() {
            const container = document.getElementById('balloonContainer');
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            
            // Posisi horizontal acak
            const posX = 5 + Math.random() * 90;
            balloon.style.left = `${posX}%`;
            
            // Warna balon acak (cerah)
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#FF8A5C', '#A29BFE'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            // Ukuran balon acak
            const size = 30 + Math.random() * 40;
            
            // Durasi terbang acak
            const duration = 6 + Math.random() * 4;
            balloon.style.animationDuration = `${duration}s`;
            
            // Delay acak
            const delay = Math.random() * 2;
            balloon.style.animationDelay = `${delay}s`;
            
            // Buat body balon
            const body = document.createElement('div');
            body.className = 'balloon-body';
            body.style.backgroundColor = color;
            body.style.width = `${size}px`;
            body.style.height = `${size * 1.2}px`;
            
            // Tambahkan efek kilau pada balon
            body.style.boxShadow = `inset -10px -10px 20px rgba(0,0,0,0.2), 
                                   inset 5px 5px 20px rgba(255,255,255,0.3)`;
            
            // Tali balon
            const string = document.createElement('div');
            string.className = 'balloon-string';
            
            balloon.appendChild(body);
            balloon.appendChild(string);
            
            // Tambahkan efek sway (bergoyang) pada beberapa balon
            if (Math.random() > 0.5) {
                balloon.classList.add('sway');
            }
            
            container.appendChild(balloon);
            
            // Hapus balon setelah animasi selesai
            setTimeout(() => {
                balloon.remove();
            }, (duration + delay) * 1000 + 500);
        }

        function createBalloons(count = 20) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    createBalloon();
                }, i * 200); // Muncul bergantian
            }
        }
        // --- AKHIR FUNGSI BALON ---

        // --- GSAP ANIMASI ---
        // Animasi untuk bintang-bintang
        gsap.utils.toArray('.star').forEach((star, i) => {
            gsap.to(star, {
                scale: 1.5,
                opacity: 0.8,
                duration: 1 + Math.random(),
                repeat: -1,
                yoyo: true,
                delay: Math.random() * 2,
                ease: 'sine.inOut'
            });
        });

        // Animasi pulse untuk kado (sebelum diklik)
        const giftBox = document.getElementById('giftBox');
        gsap.to(giftBox, {
            scale: 1.05,
            duration: 1.5,
            repeat: -1,
            yoyo: true,
            ease: 'sine.inOut',
            delay: 0.5
        });

        // Animasi glow untuk teks
        gsap.to('.top-text', {
            textShadow: '0 0 20px rgba(255,255,255,0.5)',
            duration: 2,
            repeat: -1,
            yoyo: true,
            ease: 'sine.inOut'
        });

        // --- EVENT KLIK KADO ---
        giftBox.addEventListener('click', function() {
            // 1. Hentikan animasi pulse
            gsap.killTweensOf(this);
            
            // 2. Tambahkan class 'open' untuk animasi CSS
            this.classList.add('open');
            
            // 3. Animasi GSAP saat membuka
            gsap.to('.gift-lid', {
                rotation: -15,
                duration: 0.6,
                ease: 'power2.out'
            });
            
            gsap.to('.bow', {
                scale: 1.3,
                rotation: 10,
                duration: 0.5,
                ease: 'back.out(2)'
            });
            
            // 4. Efek kilauan
            gsap.to('.gift-box', {
                boxShadow: '0 0 50px rgba(163, 196, 247, 0.8)',
                duration: 0.5,
                ease: 'power2.out'
            });
            
            // 5. Munculkan balon-balon
            createBalloons(25);
            
            // 6. Efek gemuruh/ledakan partikel
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.style.cssText = `
                        position: fixed;
                        width: 4px;
                        height: 4px;
                        background: ${['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFEAA7'][Math.floor(Math.random() * 5)]};
                        border-radius: 50%;
                        pointer-events: none;
                        z-index: 30;
                        left: ${50 + (Math.random() - 0.5) * 60}%;
                        top: ${50 + (Math.random() - 0.5) * 60}%;
                    `;
                    document.body.appendChild(sparkle);
                    
                    gsap.to(sparkle, {
                        x: (Math.random() - 0.5) * 400,
                        y: (Math.random() - 0.5) * 400 - 200,
                        scale: 0,
                        opacity: 0,
                        duration: 1 + Math.random(),
                        ease: 'power2.out',
                        onComplete: () => sparkle.remove()
                    });
                }, i * 50);
            }
            
            // 7. Arahkan ke halaman berikutnya setelah animasi selesai
            setTimeout(function() {
                window.location.href = 'master-kado.html';
            }, 2500);
        });

        // --- AUTO START: Munculkan beberapa balon awal sebagai teaser ---
        setTimeout(() => {
            createBalloons(5);
        }, 2000);
    </script>

</body>
</html>
